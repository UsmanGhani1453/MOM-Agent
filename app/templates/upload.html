{% extends "base.html" %}
{% block title %}Upload meeting{% endblock %}
{% block content %}
<h1>Upload meeting</h1>
{% if error %}<p class="alert error">{{ error }}</p>{% endif %}
<form class="card" action="/upload" method="post" enctype="multipart/form-data" id="upload-form">
  <label>Recording <small>(mp3, wav, m4a, mp4, webm, ogg, flac - up to {{ max_mb }} MB)</small>
    <input type="file" name="file" accept=".mp3,.wav,.m4a,.mp4,.webm,.ogg,.flac" required>
  </label>
  <label>Meeting date
    <input type="date" name="meeting_date" value="{{ today }}">
  </label>
  <button class="btn" type="submit">Upload &amp; generate minutes</button>
  <p class="muted" id="upload-note" hidden>Uploading... large files can take a moment.</p>
</form>
{% endblock %}
